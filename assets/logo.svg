<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="West Stone Law">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0C988"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>
  <!-- Stone monolith mark -->
  <g>
    <rect x="6" y="10" width="14" height="44" rx="2" fill="#0F2A4A"/>
    <rect x="24" y="4" width="14" height="50" rx="2" fill="url(#goldGrad)"/>
    <rect x="42" y="16" width="14" height="38" rx="2" fill="#163A63"/>
    <rect x="6" y="54" width="50" height="4" rx="2" fill="#0F2A4A"/>
  </g>
  <!-- Wordmark -->
  <text x="70" y="30" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" letter-spacing="1" fill="#0F2A4A">WEST STONE</text>
  <text x="70" y="50" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="5" fill="#C9A24B">L A W&#160;&#160;F I R M</text>
